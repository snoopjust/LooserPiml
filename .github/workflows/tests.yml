name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install busted

      - name: Fetch libraries
        shell: pwsh
        run: ./tools/fetch-libs.ps1

      - name: Run tests
        run: busted
